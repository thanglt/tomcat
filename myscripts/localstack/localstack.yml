version: "3.8"
services:
  localstack:
    container_name: localstack-main
    image: localstack/localstack:latest
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      EXTRA_CORS_ALLOWED_ORIGINS: http://localhost:8080,https://app.localstack.cloud
      EXTRA_CORS_ALLOWED_HEADERS: x-api-key,Authorization
      # You can specify which services to load, e.g., SERVICES=s3,lambda
      SERVICES: s3
      # Set default credentials (test/test is common in LocalStack)
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      # Set region
      AWS_DEFAULT_REGION: us-east-1
      # Mount volume for persistence
    volumes:
      - localstack-data:/var/lib/localstack
volumes:
  localstack-data:
